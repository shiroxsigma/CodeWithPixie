name: test

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: windows-latest

    steps:
      - name: Checkout CodeWithPixie
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies for browser test
        run: python -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Type-check and test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run browser smoke test
        working-directory: frontend
        run: npm run test:e2e

  cwp-awp-contract:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout CodeWithPixie
        uses: actions/checkout@v4

      - name: Checkout AnythingWithPixie public API
        uses: actions/checkout@v4
        with:
          repository: shiroxsigma/AnythingWithPixie
          path: AnythingWithPixie

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit and AWP integration tests
        env:
          CWP_AWP_SRC: ./AnythingWithPixie/src
        run: python -m pytest -q
