<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeWithPixie</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    /* CWP 固有の追加スタイル（承認バー・ステータス・ツールログ） */
    #agent-status { font-size: 12px; opacity: .8; margin-left: 8px; }
    #root-project-btn {
      display: inline-flex; align-items: center; gap: 4px; margin: 0 6px;
      max-width: 320px; cursor: pointer; font-size: 13px;
    }
    #root-project-btn #root-project-name {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600;
    }
    .msg.status { opacity: .75; font-size: 12px; font-style: italic; white-space: pre-wrap; }
    .msg.error  { color: #ff6b6b; white-space: pre-wrap; }
    #approval {
      border: 1px solid #d08b28; background: rgba(208,139,40,.12);
      border-radius: 8px; padding: 10px; margin: 8px 0;
    }
    #approval h4 { margin: 0 0 6px; font-size: 13px; }
    #approval .call { font-family: ui-monospace, monospace; font-size: 12px;
      background: rgba(0,0,0,.25); border-radius: 6px; padding: 6px 8px; margin: 4px 0;
      white-space: pre-wrap; word-break: break-word; }
    #approval .call .danger { color: #ffb454; font-weight: 700; }
    #approval .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    #approval textarea { flex: 1; min-height: 34px; resize: vertical; }
    .btn-approve { background: #2e7d32; color: #fff; }
    .btn-reject  { background: #6b2e2e; color: #fff; }
    #interrupt-btn { background: #6b2e2e; color: #fff; }
    .changed-badge { color: #7bd88f; font-size: 11px; margin-left: 6px; }
    li.file.changed > .name { color: #7bd88f; }
  </style>
</head>
<body>
  <header id="topbar">
    <div class="brand">🧚 CodeWithPixie</div>
    <button id="root-project-btn" title="ルートプロジェクト（作業対象フォルダ）を変更">
      📁 <span id="root-project-name">…</span>
    </button>
    <div class="file-info">
      <span id="current-file">（ファイル未選択）</span>
      <button id="save-btn" title="保存 (Ctrl+S)">保存</button>
      <span id="save-state"></span>
    </div>
    <div class="model-info">model: <span id="model-name">…</span><span id="agent-status"></span></div>
    <button id="settings-btn" title="設定（モデル）">⚙️</button>
  </header>

  <main id="split">
    <!-- 左：コードエディタ -->
    <section id="left-pane">
      <div id="editor"></div>
      <div id="left-toolbar">
        <span id="sel-info" class="hint">エージェントがファイルを直接編集します（破壊操作は承認制）。</span>
      </div>
    </section>

    <div id="divider" title="ドラッグで幅を調整"></div>

    <!-- 右：ファイルツリー & チャット -->
    <section id="right-pane">
      <div id="filemgr">
        <div class="section-head">
          <span>ファイル（ワークスペース）</span>
          <span class="fm-actions">
            <button id="folder-btn" title="作業フォルダを変更">📂</button>
            <button id="refresh-btn" title="再読込">⟳</button>
            <button id="new-file-btn" title="新規ファイル">📄+</button>
            <button id="new-folder-btn" title="新規フォルダ">📁+</button>
          </span>
          <input id="file-search" type="search" placeholder="🔍 全文検索…" />
        </div>
        <div id="root-bar">
          <span id="root-path" title="現在の作業フォルダ"></span>
        </div>
        <ul id="file-list"></ul>
        <div id="search-results" class="hidden"></div>
      </div>

      <div id="chat">
        <div id="messages"></div>
        <div id="approval" class="hidden"></div>
        <div id="composer">
          <textarea id="chat-input" rows="3"
            placeholder="例）src/foo.py に入力値を検証する関数を追加して。テストも書いて実行して確認して。"></textarea>
          <div class="composer-actions">
            <span class="hint">Ctrl+Enter で送信</span>
            <span id="session-info" class="hint" title="この会話のセッションID"></span>
            <button id="new-session-btn" title="新しい会話を開始（並行セッション）">＋新規会話</button>
            <button id="interrupt-btn" class="hidden">■ 中断</button>
            <button id="send-btn">送信</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 作業フォルダ選択ダイアログ -->
  <div id="root-modal" class="hidden">
    <div id="root-dialog">
      <div class="root-head">📂 ルートプロジェクト（作業対象フォルダ）を選ぶ</div>
      <div id="root-drives"></div>
      <input id="root-input" type="text" spellcheck="false"
        placeholder="例: D:\projects\myapp（Enter で移動）" />
      <ul id="root-dirlist"></ul>
      <div class="root-hint hint">フォルダをクリックで移動 ／ パス直接入力＋Enter でも移動。決定するとファイルブラウザが切替わり、新しい会話がそのフォルダで始まります。</div>
      <div class="root-actions">
        <button id="root-cancel">キャンセル</button>
        <button id="root-ok" class="apply-btn">✓ このフォルダにする</button>
      </div>
    </div>
  </div>

  <!-- 設定ダイアログ（⚙️ モデル/サーバ・Copilot） -->
  <div id="settings-modal" class="hidden">
    <div id="settings-dialog">
      <div class="root-head">⚙️ 設定</div>
      <label class="settings-row">
        <span><b>モデル / サーバ</b><span class="hint">以降の新しい会話に反映されます。</span></span>
        <select id="settings-model"></select>
      </label>
      <label class="settings-row toggle">
        <input type="checkbox" id="settings-copilot" />
        <span>
          <b>Copilot 連携</b>
          <span class="hint">オンにすると、エージェントが <code>ask_copilot</code> ツールで Microsoft Copilot に相談できます（PrayLight 経由）。</span>
        </span>
      </label>
      <div class="settings-row" id="copilot-controls">
        <button id="copilot-open-btn" title="Copilot にログインするためのブラウザを開く">🕊️ Copilot ブラウザを開く（ログイン用）</button>
        <span id="copilot-status" class="hint"></span>
      </div>
      <div class="root-actions">
        <button id="settings-close" class="apply-btn">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    window.__MONACO_VS__ = "/static/vendor/monaco/min/vs";
  </script>
  <script src="/static/js/monaco-loader.js"></script>
  <script src="/static/js/app.js" type="module"></script>
</body>
</html>
