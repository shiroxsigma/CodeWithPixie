<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeWithPixie</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=3" />
  <link rel="shortcut icon" href="/static/favicon.svg?v=3" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app"></div>

  <script>
    window.__MONACO_VS__ = "/static/vendor/monaco/min/vs";
  </script>
  <!-- markdown-it / mermaid（UMD）。scripts/fetch_markdown_it.py と fetch_mermaid.py で取得する。
       未取得なら 404 になるが、その場合それぞれの機能が無効化されるだけで編集は続けられる。 -->
  <script src="/static/vendor/markdown-it/markdown-it.min.js"></script>
  <script src="/static/vendor/mermaid/mermaid.min.js"></script>
  <!-- js-yaml（UMD）。scripts/fetch_js_yaml.py で取得。mdflow 条件マッピングの解析に使う（Note モード）。 -->
  <script src="/static/vendor/js-yaml/js-yaml.min.js"></script>
  <!-- turndown + GFM プラグイン（UMD）。scripts/fetch_turndown.py で取得。
       Confluence 等から貼り付けたHTMLのMarkdown変換に使う。未取得なら 404 になるが、
       その場合は貼り付けダイアログがプレーンテキスト挿入に縮退するだけで編集は続けられる。 -->
  <script src="/static/vendor/turndown/turndown.umd.js"></script>
  <script src="/static/vendor/turndown/turndown-plugin-gfm.js"></script>
  <script src="/static/js/monaco-loader.js"></script>
  <script src="/static/vue/app.js" type="module"></script>
</body>
</html>
